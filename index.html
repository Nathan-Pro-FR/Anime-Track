<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Anime Tracker Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0b0f 0%, #14141f 100%);
            --card-bg: #171725;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-border: rgba(94, 114, 228, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #6c7293;
            --accent: #5e72e4;
            --accent-hover: #4353cc;
            --danger: #fa5c7c;
            --star-color: #ffb703;
            
            /* Couleurs des Statuts */
            --color-pas-commence: #6c7293;
            --color-en-cours: #39b5ff;
            --color-vu: #0acf97;
            --color-en-pause: #ffaa00;
            --color-abandonne: #fa5c7c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
        }

        /* --- HEADER & DASHBOARD --- */
        header {
            margin-bottom: 40px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(90deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            border-radius: 20px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .stat-card.total { background: linear-gradient(135deg, #1e1e38 0%, #2b2b54 100%); }
        .stat-card.watching { background: linear-gradient(135deg, #0f2b48 0%, #1a4473 100%); }
        .stat-card.completed { background: linear-gradient(135deg, #053429 0%, #0d5443 100%); }
        .stat-card.average { background: linear-gradient(135deg, #3d2b08 0%, #61450c 100%); }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .stat-card.total .stat-icon { color: #8a99ff; }
        .stat-card.watching .stat-icon { color: #50bfff; }
        .stat-card.completed .stat-icon { color: #10f0b6; }
        .stat-card.average .stat-icon { color: #ffca28; }

        .stat-info .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .stat-info .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        /* --- CONTROLES & VIEWS --- */
        .controls-panel {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .search-filters-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            flex: 1;
            max-width: 950px;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex: 2;
            min-width: 220px;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input[type="text"], .filter-select {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: #1c1c2d;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }

        .filter-select {
            padding-left: 16px;
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }

        input[type="text"]:focus, .filter-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(94, 114, 228, 0.15);
        }

        /* Option 4 : Boutons Layout Switch */
        .view-switchers {
            display: inline-flex;
            background: #1c1c2d;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--accent);
            color: white;
        }

        .data-buttons { display: flex; gap: 10px; }

        .btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: #1c1c2d; border-color: var(--card-border); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }

        /* --- RECHERCHE --- */
        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #161624;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .search-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .search-item:hover { background: rgba(255, 255, 255, 0.05); }
        .search-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 6px; }
        .search-item .info-box { display: flex; flex-direction: column; gap: 4px; }
        .search-item .title { font-weight: 600; font-size: 0.95rem; color: #fff; }
        .search-item .meta { font-size: 0.8rem; color: var(--text-muted); }

        /* --- LAYOUT OPTION 4 : MODE GRILLE --- */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }

        .anime-grid .anime-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .anime-grid .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .anime-grid .anime-cover-wrapper {
            position: relative;
            height: 240px;
            width: 100%;
            overflow: hidden;
        }

        .anime-grid .anime-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .anime-grid .anime-cover-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 70%;
            background: linear-gradient(to top, var(--card-bg) 0%, rgba(23, 23, 37, 0) 100%);
        }

        .anime-grid .status-badge-pill {
            position: absolute; top: 15px; right: 15px; padding: 6px 12px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; z-index: 2;
        }

        .anime-grid .anime-content { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; gap: 16px; }
        .anime-grid .anime-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; color: #fff; height: 44px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .anime-grid .anime-synopsis { font-size: 0.85rem; color: #9292af; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .anime-grid .anime-synopsis.expanded { -webkit-line-clamp: unset; }

        /* --- LAYOUT OPTION 4 : MODE LISTE / TABLEAU COMPACT --- */
        .anime-grid.list-view {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .anime-grid.list-view .anime-card {
            flex-direction: row;
            align-items: center;
            padding: 10px 20px;
            border-radius: 12px;
            gap: 20px;
        }

        .anime-grid.list-view .anime-cover-wrapper {
            width: 50px; height: 70px; border-radius: 6px; flex-shrink: 0;
        }
        .anime-grid.list-view .anime-cover-wrapper::after { display: none; }
        .anime-grid.list-view .status-badge-pill { display: none; } /* On le cache car on a déjà le select coloré */

        .anime-grid.list-view .anime-content {
            padding: 0; flex-direction: row; align-items: center; width: 100%; justify-content: space-between; gap: 20px;
        }

        .anime-grid.list-view .anime-title { height: auto; -webkit-line-clamp: 1; min-width: 200px; flex: 2; }
        .anime-grid.list-view .anime-synopsis { display: none; } /* Caché en mode liste compacte */
        
        .anime-grid.list-view .episode-tracker { min-width: 160px; flex: 1; background: transparent; border: none; padding: 0; }
        .anime-grid.list-view .status-select-custom { max-width: 160px; flex: 1; }
        .anime-grid.list-view .rating-block { background: transparent; border: none; padding: 0; flex: 1; justify-content: center; gap: 10px; }
        .anime-grid.list-view .delete-btn { max-width: 45px; padding: 10px; font-size: 0.9rem; }
        .anime-grid.list-view .delete-btn span { display: none; } /* Enlever le texte "Retirer" */
        .anime-grid.list-view .notes-toggle-btn { margin: 0 !important; }

        /* OPTION 2 & 4 : PROGRESSION ÉPISODES */
        .episode-tracker { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px 14px; border-radius: 12px; }
        .episode-label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
        .episode-controls { display: flex; align-items: center; gap: 12px; }
        .ep-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: #2a2a3d; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .ep-btn:hover { background: var(--accent); }
        .episode-display { font-size: 0.9rem; font-weight: 700; color: #fff; min-width: 55px; text-align: center; }
        .ep-total-input { width: 32px; background: transparent; border: none; border-bottom: 1px dashed var(--text-muted); color: #fff; font-weight: 700; text-size: 0.9rem; text-align: center; outline: none; }

        /* OPTION 3 : COMPOSANT DES NOTES ET COMMENTAIRES */
        .notes-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px;
            margin-top: 5px;
            display: none; /* Déplié via JS */
        }

        .notes-textarea {
            width: 100%;
            height: 70px;
            background: #11111a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            padding: 8px;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        .notes-textarea:focus { border-color: var(--accent); }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .notes-toggle-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .notes-toggle-btn.has-notes { color: var(--star-color); border-color: rgba(255, 183, 3, 0.3); }
        .notes-toggle-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* --- GLOBALS --- */
        .status-select-custom { background: #222235; border: 1px solid var(--card-border); color: var(--text-main); padding: 12px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; outline: none; font-size: 0.85rem; }
        .status-select-custom option { background: #171725; color: white; }
        .rating-block { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.02); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .stars-container { display: inline-flex; gap: 4px; }
        .star-item { width: 22px; height: 22px; cursor: pointer; background: #374151; display: inline-block; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .rating-value { font-size: 0.85rem; font-weight: 700; color: #fff; }
        .delete-btn { width: 100%; background: rgba(250, 92, 124, 0.08); border: 1px solid rgba(250, 92, 124, 0.15); color: var(--danger); justify-content: center; }
        .delete-btn:hover { background: var(--danger); color: white; }

        @media (max-width: 950px) {
            .controls-panel { flex-direction: column; align-items: stretch; }
            .search-filters-group { flex-direction: column; }
            .anime-grid.list-view .anime-content { flex-direction: column; align-items: stretch; }
            .anime-grid.list-view .anime-card { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-main">
            <h1>My Anime Tracker <span style="font-size:1.2rem; color:var(--accent)">v2.5</span></h1>
            <div class="data-buttons">
                <button class="btn btn-secondary" onclick="exportData('json')"><i class="fa-solid fa-code"></i> Export JSON</button>
                <button class="btn btn-secondary" onclick="exportData('csv')"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <button class="btn btn-primary" onclick="document.getElementById('import-file').click()"><i class="fa-solid fa-file-import"></i> Importer</button>
                <input type="file" id="import-file" style="display: none;" accept=".json,.csv" onchange="importData(event)">
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fa-solid fa-film"></i></div>
                <div class="stat-info"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total suivis</div></div>
            </div>
            <div class="stat-card watching">
                <div class="stat-icon"><i class="fa-solid fa-play"></i></div>
                <div class="stat-info"><div class="stat-value" id="stat-watching">0</div><div class="stat-label">En cours</div></div>
            </div>
            <div class="stat-card completed">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info"><div class="stat-value" id="stat-completed">0</div><div class="stat-label">Terminés</div></div>
            </div>
            <div class="stat-card average">
                <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
                <div class="stat-info"><div class="stat-value" id="stat-average">0.0</div><div class="stat-label">Note Moyenne</div></div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="search-filters-group">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Rechercher un anime via l'API...">
                    <div id="search-results" class="search-results" style="display: none;"></div>
                </div>
                
                <select id="filter-status" class="filter-select" onchange="renderList()">
                    <option value="Tous">📊 Tous les statuts</option>
                    <option value="Pas commencé">⏳ Pas commencé</option>
                    <option value="En cours">👀 En cours</option>
                    <option value="Vu">✅ Vu</option>
                    <option value="En pause">⏸️ En pause</option>
                    <option value="Abandonné">❌ Abandonné</option>
                </select>

                <select id="sort-by" class="filter-select" onchange="renderList()">
                    <option value="date-desc">📅 Ajout (Récents)</option>
                    <option value="rating-desc">⭐ Note (Décroissante)</option>
                    <option value="rating-asc">⭐ Note (Croissante)</option>
                    <option value="title-asc">🔤 Titre (A-Z)</option>
                </select>

                <div class="view-switchers">
                    <button class="view-btn active" id="view-grid-btn" onclick="switchView('grid')" title="Mode Grille"><i class="fa-solid fa-grid-2"></i>📊</button>
                    <button class="view-btn" id="view-list-btn" onclick="switchView('list')" title="Mode Liste Compacte"><i class="fa-solid fa-list"></i>☰</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="anime-grid" id="anime-list"></div>
    </main>
</div>

<script>
    let myAnimes = JSON.parse(localStorage.getItem('myAnimesPro')) || [];
    let currentLayout = 'grid'; // Layout par défaut ('grid' ou 'list')

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const animeListContainer = document.getElementById('anime-list');

    const statusColors = {
        "Pas commencé": "var(--color-pas-commence)",
        "En cours": "var(--color-en-cours)",
        "Vu": "var(--color-vu)",
        "En pause": "var(--color-en-pause)",
        "Abandonné": "var(--color-abandonne)"
    };

    // --- RECHERCHE JIKAN API ---
    let debounceTimer;
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
        if (query.length < 3) { searchResults.style.display = 'none'; return; }

        debounceTimer = setTimeout(async () => {
            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=6`);
                const data = await response.json();
                displaySearchResults(data.data);
            } catch (error) { console.error("Erreur API:", error); }
        }, 400);
    });

    function displaySearchResults(animes) {
        searchResults.innerHTML = '';
        if (!animes || animes.length === 0) { searchResults.style.display = 'none'; return; }

        animes.forEach(anime => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `
                <img src="${anime.images.jpg.image_url}" alt="">
                <div class="info-box">
                    <span class="title">${anime.title}</span>
                    <span class="meta">${anime.type || 'TV'} • ${anime.episodes || '?'} éps</span>
                </div>
            `;
            div.onclick = () => addAnime(anime);
            searchResults.appendChild(div);
        });
        searchResults.style.display = 'block';
    }

    // --- ANIMATION INTERACTIVE DES COMPTEURS ---
    function animateCounter(id, targetValue, isFloat = false) {
        const el = document.getElementById(id);
        const startValue = parseFloat(el.innerText) || 0;
        const duration = 600;
        let startTime = null;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = Math.min((timestamp - startTime) / duration, 1);
            const easeProgress = progress * (2 - progress);
            const currentValue = startValue + (targetValue - startValue) * easeProgress;

            el.innerText = isFloat ? currentValue.toFixed(1) : Math.floor(currentValue);

            if (progress < 1) window.requestAnimationFrame(step);
            else el.innerText = isFloat ? targetValue.toFixed(1) : targetValue;
        }
        window.requestAnimationFrame(step);
    }

    function updateDashboard() {
        animateCounter('stat-total', myAnimes.length);
        animateCounter('stat-watching', myAnimes.filter(a => a.status === 'En cours').length);
        animateCounter('stat-completed', myAnimes.filter(a => a.status === 'Vu').length);
        
        const ratedAnimes = myAnimes.filter(a => a.rating > 0);
        const avg = ratedAnimes.length ? parseFloat((ratedAnimes.reduce((sum, a) => sum + a.rating, 0) / ratedAnimes.length).toFixed(1)) : 0.0;
        animateCounter('stat-average', avg, true);
    }

    // --- OPTION 4 : SWITCH VIEW ---
    function switchView(view) {
        currentLayout = view;
        document.getElementById('view-grid-btn').classList.toggle('active', view === 'grid');
        document.getElementById('view-list-btn').classList.toggle('active', view === 'list');
        renderList();
    }

    // --- FONCTIONS CRUD ---
    function addAnime(apiAnime) {
        if (myAnimes.some(a => a.id === apiAnime.mal_id)) { alert("Anime déjà ajouté."); return; }

        const newAnime = {
            id: apiAnime.mal_id,
            title: apiAnime.title,
            image: apiAnime.images.jpg.image_url,
            synopsis: apiAnime.synopsis || "Pas de synopsis.",
            status: "Pas commencé",
            rating: 0,
            currentEpisode: 0,
            totalEpisodes: apiAnime.episodes || 12,
            notes: "", // Option 3 : Initialisation champ note vide
            addedAt: Date.now()
        };

        myAnimes.push(newAnime);
        saveAndRender();
        searchInput.value = '';
        searchResults.style.display = 'none';
    }

    function updateEpisode(id, increment) {
        myAnimes = myAnimes.map(anime => {
            if (anime.id === id) {
                let current = (anime.currentEpisode || 0) + increment;
                let total = anime.totalEpisodes || 12;

                if (current < 0) current = 0;
                if (current > total) current = total;

                let status = anime.status;
                if (current > 0 && status === "Pas commencé") status = "En cours";
                if (current === total && total > 0) status = "Vu";
                if (current === 0 && status === "En cours") status = "Pas commencé";

                return { ...anime, currentEpisode: current, status: status };
            }
            return anime;
        });
        saveAndRender();
    }

    function changeTotalEpisodes(id, newTotal) {
        let total = parseInt(newTotal) || 0;
        if (total < 1) total = 1;
        
        myAnimes = myAnimes.map(anime => {
            if (anime.id === id) {
                let current = anime.currentEpisode || 0;
                if (current > total) current = total;
                let status = (current === total) ? "Vu" : anime.status;
                return { ...anime, totalEpisodes: total, currentEpisode: current, status: status };
            }
            return anime;
        });
        saveAndRender();
    }

    function changeStatus(id, newStatus) {
        myAnimes = myAnimes.map(anime => {
            if (anime.id === id) {
                let current = anime.currentEpisode || 0;
                if (newStatus === "Vu") current = anime.totalEpisodes || 12;
                if (newStatus === "Pas commencé") current = 0;
                return { ...anime, status: newStatus, currentEpisode: current };
            }
            return anime;
        });
        saveAndRender();
    }

    function changeRating(id, ratingValue) {
        myAnimes = myAnimes.map(a => a.id === id ? { ...a, rating: ratingValue } : a);
        saveAndRender();
    }

    // OPTION 3 : SAUVEGARDE DES REMARQUES PERSONNELLES
    function saveNotes(id, text) {
        myAnimes = myAnimes.map(anime => anime.id === id ? { ...anime, notes: text } : anime);
        localStorage.setItem('myAnimesPro', JSON.stringify(myAnimes));
    }

    function deleteAnime(id) {
        if(confirm("Supprimer cet anime de ta liste ?")) {
            myAnimes = myAnimes.filter(a => a.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('myAnimesPro', JSON.stringify(myAnimes));
        renderList();
    }

    // --- RENDU GÉNÉRAL ---
    function renderList() {
        updateDashboard();
        animeListContainer.innerHTML = '';
        
        // Appliquer la classe correspondante au Layout sélectionné
        if(currentLayout === 'list') animeListContainer.classList.add('list-view');
        else animeListContainer.classList.remove('list-view');

        const activeFilter = document.getElementById('filter-status').value;
        const activeSort = document.getElementById('sort-by').value;

        let filteredList = myAnimes.filter(anime => activeFilter === "Tous" || anime.status === activeFilter);

        filteredList.sort((a, b) => {
            if (activeSort === 'rating-desc') return b.rating - a.rating;
            if (activeSort === 'rating-asc') return a.rating - b.rating;
            if (activeSort === 'title-asc') return a.title.localeCompare(b.title);
            return b.addedAt - a.addedAt;
        });

        if (filteredList.length === 0) {
            animeListContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:60px 0;"><i class="fa-solid fa-folder-open" style="font-size:3rem; margin-bottom:15px; display:block;"></i>Aucun anime trouvé.</div>`;
            return;
        }

        filteredList.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'anime-card';

            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                let fillPercent = 0;
                if (anime.rating >= i) fillPercent = 100;
                else if (anime.rating === i - 0.5) fillPercent = 50;

                starsHTML += `<div class="star-item" style="background: linear-gradient(90deg, var(--star-color) ${fillPercent}%, #374151 ${fillPercent}%);" onclick="handleStarClick(${anime.id}, ${i}, event)"></div>`;
            }

            const currentBadgeColor = statusColors[anime.status] || "gray";
            const currentEp = anime.currentEpisode || 0;
            const totalEp = anime.totalEpisodes || 12;
            const userNotes = anime.notes || "";

            card.innerHTML = `
                <div class="anime-cover-wrapper">
                    <span class="status-badge-pill" style="background:${currentBadgeColor}; color:#111;">${anime.status}</span>
                    <img src="${anime.image}" alt="">
                </div>
                <div class="anime-content">
                    <div class="anime-title" title="${anime.title}">${anime.title}</div>
                    <div class="anime-synopsis" onclick="this.classList.toggle('expanded')" title="Cliquez pour étendre">
                        ${anime.synopsis}
                    </div>
                    
                    <div class="episode-tracker">
                        <span class="episode-label">Progression</span>
                        <div class="episode-controls">
                            <button class="ep-btn" onclick="updateEpisode(${anime.id}, -1)">-</button>
                            <div class="episode-display">
                                <span>${currentEp}</span> / 
                                <input type="number" class="ep-total-input" value="${totalEp}" onchange="changeTotalEpisodes(${anime.id}, this.value)">
                            </div>
                            <button class="ep-btn" onclick="updateEpisode(${anime.id}, 1)">+</button>
                        </div>
                    </div>

                    <select class="status-select-custom" onchange="changeStatus(${anime.id}, this.value)">
                        <option value="Pas commencé" ${anime.status === 'Pas commencé' ? 'selected' : ''}>⏳ Pas commencé</option>
                        <option value="En cours" ${anime.status === 'En cours' ? 'selected' : ''}>👀 En cours</option>
                        <option value="Vu" ${anime.status === 'Vu' ? 'selected' : ''}>✅ Vu</option>
                        <option value="En pause" ${anime.status === 'En pause' ? 'selected' : ''}>⏸️ En pause</option>
                        <option value="Abandonné" ${anime.status === 'Abandonné' ? 'selected' : ''}>❌ Abandonné</option>
                    </select>

                    <div class="rating-block">
                        <div class="stars-container">${starsHTML}</div>
                        <span class="rating-value">${anime.rating} / 5</span>
                    </div>

                    <div class="actions-row">
                        <button class="notes-toggle-btn ${userNotes.trim() ? 'has-notes' : ''}" id="note-btn-${anime.id}" onclick="toggleNotesBlock(${anime.id})" title="Ajouter des notes/avis">
                            <i class="fa-solid fa-comment-dots"></i>
                        </button>
                        <button class="btn delete-btn" onclick="deleteAnime(${anime.id})"><i class="fa-solid fa-trash-can"></i> <span>Retirer</span></button>
                    </div>

                    <div class="notes-container" id="notes-block-${anime.id}">
                        <div class="notes-header">
                            <span>Mon avis / Notes perso :</span>
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <textarea class="notes-textarea" placeholder="Ex: Arc 2 incroyable, chef d'oeuvre..." oninput="saveNotes(${anime.id}, this.value)">${userNotes}</textarea>
                    </div>
                </div>
            `;
            animeListContainer.appendChild(card);
        });
    }

    function handleStarClick(animeId, starIndex, event) {
        const rect = event.target.getBoundingClientRect();
        const isHalf = (event.clientX - rect.left) < (rect.width / 2);
        let finalRating = isHalf ? starIndex - 0.5 : starIndex;
        
        const current = myAnimes.find(a => a.id === animeId);
        if (current && current.rating === finalRating) finalRating = 0;

        changeRating(animeId, finalRating);
    }

    // TOGGLE AFFICHAGE ZONE DE TEXTE COMMENTAIRE
    function toggleNotesBlock(id) {
        const block = document.getElementById(`notes-block-${id}`);
        if(block.style.display === 'block') {
            block.style.display = 'none';
        } else {
            block.style.display = 'block';
        }
    }

    // --- EXPORTS & IMPORTS (INCLUS NOTES & EPISODES) ---
    function exportData(format) {
        if (myAnimes.length === 0) return alert("Aucune donnée à exporter.");
        let dataStr = "";
        let filename = `mon_anime_tracker_${Date.now()}`;

        if (format === 'json') {
            dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myAnimes, null, 2));
            filename += ".json";
        } else if (format === 'csv') {
            let csvContent = "id,title,status,rating,currentEpisode,totalEpisodes,notes,addedAt\n";
            myAnimes.forEach(a => {
                let safeTitle = a.title.replace(/"/g, '""');
                let safeNotes = (a.notes || "").replace(/"/g, '""').replace(/\n/g, ' ');
                csvContent += `${a.id},"${safeTitle}","${a.status}",${a.rating},${a.currentEpisode || 0},${a.totalEpisodes || 12},"${safeNotes}",${a.addedAt}\n`;
            });
            dataStr = "data:text/csv;charset=utf-8,\uFEFF" + encodeURIComponent(csvContent);
            filename += ".csv";
        }

        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", filename);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const extension = file.name.split('.').pop().toLowerCase();

        reader.onload = function(e) {
            try {
                if (extension === 'json') {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) { myAnimes = imported; saveAndRender(); }
                } 
                else if (extension === 'csv') {
                    alert("Pour l'import d'une base lourde comprenant les commentaires, privilégiez le format .json !");
                }
            } catch (err) { alert("Erreur lors de l'import."); }
        };
        reader.readAsText(file);
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-input') && !e.target.closest('#search-results')) {
            searchResults.style.display = 'none';
        }
    });

    renderList();
</script>
</body>
</html>
