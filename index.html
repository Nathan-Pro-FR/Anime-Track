<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Anime Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #2e51a2; /* Couleur MyAnimeList */
            --accent-hover: #1e3773;
            --star-color: #ffc107;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 20px;
            color: #fff;
        }

        /* Barre d'outils / Actions */
        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            background: #fff;
            color: #000;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #444;
        }
        .btn-secondary:hover {
            background-color: #555;
        }

        /* Résultats de recherche */
        .search-results {
            position: absolute;
            background: var(--card-bg);
            border: 1px solid #444;
            max-width: 400px;
            width: calc(100% - 40px);
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .search-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }

        .search-item:hover {
            background: #3d3d3d;
        }

        .search-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            margin-right: 10px;
        }

        /* Grille de la Liste d'Animes */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .anime-cover {
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .anime-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 10px;
        }

        .anime-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
        }

        .anime-synopsis {
            font-size: 12px;
            color: #ccc;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
        }
        
        .anime-synopsis.expanded {
            -webkit-line-clamp: unset;
        }

        /* Systèmes de Statut et Notes */
        .status-select {
            background: #444;
            color: white;
            width: 100%;
        }

        .stars-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 18px;
        }

        .star {
            cursor: pointer;
            color: #555;
        }

        .star.filled {
            color: var(--star-color);
        }

        .star.half-filled {
            position: relative;
            color: #555;
        }
        .star.half-filled::before {
            content: "\f089"; /* Code FontAwesome pour demi-étoile */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            left: 0;
            top: 0;
            color: var(--star-color);
            overflow: hidden;
        }

        .delete-btn {
            background: #d9534f;
            margin-top: auto;
        }
        .delete-btn:hover {
            background: #c9302c;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .actions-bar { flex-direction: column; align-items: stretch; }
            input[type="text"] { max-width: 100%; }
            .anime-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Anime Tracker 🎬</h1>
        <div class="actions-bar">
            <div style="position: relative; flex: 1; max-width: 400px;">
                <input type="text" id="search-input" placeholder="Rechercher un anime...">
                <div id="search-results" class="search-results" style="display: none;"></div>
            </div>
            <button class="btn-secondary" onclick="exportJSON()">💾 Exporter JSON</button>
            <button class="btn-secondary" onclick="document.getElementById('import-file').click()">📂 Importer JSON</button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importJSON(event)">
        </div>
    </header>

    <main>
        <div class="anime-grid" id="anime-list"></div>
    </main>
</div>

<script>
    // Stockage local des données
    let myAnimes = JSON.parse(localStorage.getItem('myAnimes')) || [];
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const animeListContainer = document.getElementById('anime-list');

    // --- RECHERCHE ET API (Jikan API / MyAnimeList Public) ---
    let debounceTimer;
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
        if (query.length < 3) {
            searchResults.style.display = 'none';
            return;
        }

        // Évite de spammer l'API
        debounceTimer = setTimeout(async () => {
            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`);
                const data = await response.json();
                displaySearchResults(data.data);
            } catch (error) {
                console.error("Erreur API:", error);
            }
        }, 500);
    });

    function displaySearchResults(animes) {
        searchResults.innerHTML = '';
        if (!animes || animes.length === 0) {
            searchResults.style.display = 'none';
            return;
        }

        animes.forEach(anime => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `
                <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                <div><strong>${anime.title}</strong></div>
            `;
            div.onclick = () => addAnime(anime);
            searchResults.appendChild(div);
        });
        searchResults.style.display = 'block';
    }

    // --- LOGIQUE METIER ---
    function addAnime(apiAnime) {
        // Vérifier si déjà présent
        if (myAnimes.some(a => a.id === apiAnime.mal_id)) {
            alert("Cet anime est déjà dans votre liste !");
            return;
        }

        const newAnime = {
            id: apiAnime.mal_id,
            title: apiAnime.title,
            image: apiAnime.images.jpg.image_url,
            synopsis: apiAnime.synopsis || "Pas de description disponible.",
            status: "Pas commencé",
            rating: 0 // Note de 0 à 5 (gère les .5)
        };

        myAnimes.push(newAnime);
        saveAndRender();
        searchInput.value = '';
        searchResults.style.display = 'none';
    }

    function changeStatus(id, newStatus) {
        myAnimes = myAnimes.map(a => a.id === id ? { ...a, status: newStatus } : a);
        saveAndRender();
    }

    function changeRating(id, ratingValue) {
        myAnimes = myAnimes.map(a => a.id === id ? { ...a, rating: ratingValue } : a);
        saveAndRender();
    }

    function deleteAnime(id) {
        myAnimes = myAnimes.filter(a => a.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('myAnimes', JSON.stringify(myAnimes));
        renderList();
    }

    // Fermer le menu de recherche si on clique ailleurs
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-input') && !e.target.closest('#search-results')) {
            searchResults.style.display = 'none';
        }
    });

    // --- RENDER DE L'INTERFACE ---
    function renderList() {
        animeListContainer.innerHTML = '';
        
        if(myAnimes.length === 0) {
            animeListContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">Votre liste est vide. Recherchez un anime ci-dessus pour commencer !</p>`;
            return;
        }

        myAnimes.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'anime-card';

            // Génération du HTML des étoiles (0 à 5 avec demi-étoiles)
            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                if (anime.rating >= i) {
                    starsHTML += `<i class="fa-solid fa-star star filled" onclick="handleStarClick(${anime.id}, ${i}, event)"></i>`;
                } else if (anime.rating >= i - 0.5) {
                    starsHTML += `<i class="fa-solid fa-star star half-filled" onclick="handleStarClick(${anime.id}, ${i}, event)"></i>`;
                } else {
                    starsHTML += `<i class="fa-solid fa-star star" onclick="handleStarClick(${anime.id}, ${i}, event)"></i>`;
                }
            }

            card.innerHTML = `
                <div class="anime-cover">
                    <img src="${anime.image}" alt="${anime.title}">
                </div>
                <div class="anime-info">
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-synopsis" onclick="this.classList.toggle('expanded')" title="Cliquez pour agrandir">
                        ${anime.synopsis}
                    </div>
                    
                    <select class="status-select" onchange="changeStatus(${anime.id}, this.value)">
                        <option value="Pas commencé" ${anime.status === 'Pas commencé' ? 'selected' : ''}>⏳ Pas commencé</option>
                        <option value="En cours" ${anime.status === 'En cours' ? 'selected' : ''}>👀 En cours</option>
                        <option value="Vu" ${anime.status === 'Vu' ? 'selected' : ''}>✅ Vu</option>
                        <option value="En pause" ${anime.status === 'En pause' ? 'selected' : ''}>⏸️ En pause</option>
                        <option value="Abandonné" ${anime.status === 'Abandonné' ? 'selected' : ''}>❌ Abandonné</option>
                    </select>

                    <div class="stars-container">
                        ${starsHTML} <span style="font-size:14px; margin-left:5px;">(${anime.rating}/5)</span>
                    </div>

                    <button class="delete-btn" onclick="deleteAnime(${anime.id})"><i class="fa-solid fa-trash"></i> Supprimer</button>
                </div>
            `;
            animeListContainer.appendChild(card);
        });
    }

    // Gestion précise du clic sur l'étoile (gauche = demi, droite = entier)
    function handleStarClick(animeId, starIndex, event) {
        const rect = event.target.getBoundingClientRect();
        const clickX = event.clientX - rect.left; // Position x du clic dans l'étoile
        const isHalf = clickX < (rect.width / 2);
        
        let finalRating = isHalf ? starIndex - 0.5 : starIndex;
        
        // Si on reclique exactement sur la même note, on peut la remettre à 0
        const currentAnime = myAnimes.find(a => a.id === animeId);
        if(currentAnime && currentAnime.rating === finalRating) {
            finalRating = 0;
        }

        changeRating(animeId, finalRating);
    }

    // --- IMPORT / EXPORT (JSON) ---
    function exportJSON() {
        if(myAnimes.length === 0) {
            alert("Rien à exporter !");
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myAnimes, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "mon_anime_list.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    myAnimes = importedData;
                    saveAndRender();
                    alert("Importation réussie !");
                } else {
                    alert("Le fichier JSON n'a pas le bon format.");
                }
            } catch (err) {
                alert("Erreur lors de la lecture du fichier JSON.");
            }
        };
        reader.readAsText(file);
    }

    // Premier rendu au chargement de la page
    renderList();
</script>
</body>
</html>
