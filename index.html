<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Anime Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f13 0%, #1a1a24 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(94, 114, 228, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #5e72e4;
            --accent-hover: #4353cc;
            --danger: #fa5c7c;
            --danger-hover: #e04463;
            --star-color: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1280px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Barre de contrôle */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 450px;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(94, 114, 228, 0.15);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--card-border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        /* Fenêtre flottante des résultats */
        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #161622;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            max-height: 380px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .search-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .search-item img {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
        }

        .search-item .title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Grille principale */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        /* Design des Cartes d'Anime */
        .anime-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .anime-cover-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
            overflow: hidden;
        }

        .anime-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .anime-card:hover .anime-cover-wrapper img {
            transform: scale(1.04);
        }

        /* Ombre douce sur l'image */
        .anime-cover-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(21, 21, 30, 1), rgba(21, 21, 30, 0));
        }

        .anime-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 16px;
            background: #15151e;
        }

        .anime-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            color: #fff;
        }

        .anime-synopsis {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            transition: color 0.2s;
        }

        .anime-synopsis:hover {
            color: var(--text-main);
        }
        
        .anime-synopsis.expanded {
            -webkit-line-clamp: unset;
        }

        /* Custom Dropdown Sélecteur */
        .status-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
        }

        .status-select:focus {
            border-color: var(--accent);
        }

        /* Fix complet du système de notation en étoiles */
        .rating-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stars-container {
            display: inline-flex;
            gap: 4px;
        }

        /* L'étoile est gérée par un masque CSS découpé sur un bloc à fond dégradé */
        .star-item {
            width: 22px;
            height: 22px;
            cursor: pointer;
            background: #374151; /* Couleur vide */
            display: inline-block;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            transition: transform 0.1s;
        }

        .star-item:hover {
            transform: scale(1.15);
        }

        .rating-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Actions du bas */
        .card-actions {
            margin-top: auto;
            padding-top: 10px;
        }

        .delete-btn {
            width: 100%;
            background: rgba(250, 92, 124, 0.1);
            border: 1px solid rgba(250, 92, 124, 0.2);
            color: var(--danger);
            justify-content: center;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Responsive */
        @media (max-width: 650px) {
            body { padding: 20px 10px; }
            h1 { font-size: 2rem; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: 100%; }
            .anime-grid { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Anime Tracker</h1>
        <div class="controls-bar">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Rechercher un anime...">
                <div id="search-results" class="search-results" style="display: none;"></div>
            </div>
            <button class="btn btn-secondary" onclick="exportJSON()"><i class="fa-solid fa-download"></i> Exporter</button>
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()"><i class="fa-solid fa-upload"></i> Importer</button>
            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importJSON(event)">
        </div>
    </header>

    <main>
        <div class="anime-grid" id="anime-list"></div>
    </main>
</div>

<script>
    let myAnimes = JSON.parse(localStorage.getItem('myAnimes')) || [];
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const animeListContainer = document.getElementById('anime-list');

    // --- RECHERCHE AVEC DEBOUNCE (API Jikan) ---
    let debounceTimer;
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
        if (query.length < 3) {
            searchResults.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`);
                const data = await response.json();
                displaySearchResults(data.data);
            } catch (error) {
                console.error("Erreur API:", error);
            }
        }, 400);
    });

    function displaySearchResults(animes) {
        searchResults.innerHTML = '';
        if (!animes || animes.length === 0) {
            searchResults.style.display = 'none';
            return;
        }

        animes.forEach(anime => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `
                <img src="${anime.images.jpg.image_url}" alt="">
                <span class="title">${anime.title}</span>
            `;
            div.onclick = () => addAnime(anime);
            searchResults.appendChild(div);
        });
        searchResults.style.display = 'block';
    }

    // --- LOGIQUE APPLICATION ---
    function addAnime(apiAnime) {
        if (myAnimes.some(a => a.id === apiAnime.mal_id)) {
            alert("Cet anime est déjà présent.");
            return;
        }

        const newAnime = {
            id: apiAnime.mal_id,
            title: apiAnime.title,
            image: apiAnime.images.jpg.image_url,
            synopsis: apiAnime.synopsis || "Aucune description fournie.",
            status: "Pas commencé",
            rating: 0
        };

        myAnimes.push(newAnime);
        saveAndRender();
        searchInput.value = '';
        searchResults.style.display = 'none';
    }

    function changeStatus(id, newStatus) {
        myAnimes = myAnimes.map(a => a.id === id ? { ...a, status: newStatus } : a);
        saveAndRender();
    }

    function changeRating(id, ratingValue) {
        myAnimes = myAnimes.map(a => a.id === id ? { ...a, rating: ratingValue } : a);
        saveAndRender();
    }

    function deleteAnime(id) {
        myAnimes = myAnimes.filter(a => a.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('myAnimes', JSON.stringify(myAnimes));
        renderList();
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-input') && !e.target.closest('#search-results')) {
            searchResults.style.display = 'none';
        }
    });

    // --- RENDU ET CORRECTION DU BUG DES ÉTOILES ---
    function renderList() {
        animeListContainer.innerHTML = '';
        
        if (myAnimes.length === 0) {
            animeListContainer.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); margin-top:40px;">Aucun anime suivi. Utilisez la barre de recherche !</p>`;
            return;
        }

        myAnimes.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'anime-card';

            // Génération dynamique des étoiles avec masques géométriques
            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                let fillPercent = 0;
                if (anime.rating >= i) {
                    fillPercent = 100;
                } else if (anime.rating === i - 0.5) {
                    fillPercent = 50;
                }

                // Utilisation d'un gradient linéaire CSS pour colorer l'étoile précisément sans bug de font
                const starStyle = `background: linear-gradient(90deg, var(--star-color) ${fillPercent}%, #374151 ${fillPercent}%);`;
                starsHTML += `<div class="star-item" style="${starStyle}" onclick="handleStarClick(${anime.id}, ${i}, event)"></div>`;
            }

            card.innerHTML = `
                <div class="anime-cover-wrapper">
                    <img src="${anime.image}" alt="">
                </div>
                <div class="anime-content">
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-synopsis" onclick="this.classList.toggle('expanded')" title="Cliquez pour étendre">
                        ${anime.synopsis}
                    </div>
                    
                    <select class="status-select" onchange="changeStatus(${anime.id}, this.value)">
                        <option value="Pas commencé" ${anime.status === 'Pas commencé' ? 'selected' : ''}>⏳ Pas commencé</option>
                        <option value="En cours" ${anime.status === 'En cours' ? 'selected' : ''}>👀 En cours</option>
                        <option value="Vu" ${anime.status === 'Vu' ? 'selected' : ''}>✅ Vu</option>
                        <option value="En pause" ${anime.status === 'En pause' ? 'selected' : ''}>⏸️ En pause</option>
                        <option value="Abandonné" ${anime.status === 'Abandonné' ? 'selected' : ''}>❌ Abandonné</option>
                    </select>

                    <div class="rating-block">
                        <div class="stars-container">${starsHTML}</div>
                        <span class="rating-value">${anime.rating} / 5</span>
                    </div>

                    <div class="card-actions">
                        <button class="btn delete-btn" onclick="deleteAnime(${anime.id})"><i class="fa-solid fa-trash-can"></i> Supprimer</button>
                    </div>
                </div>
            `;
            animeListContainer.appendChild(card);
        });
    }

    // Gestion propre du clic : gauche pour .5, droite pour l'unité entière
    function handleStarClick(animeId, starIndex, event) {
        const rect = event.target.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const isHalf = clickX < (rect.width / 2);
        
        let finalRating = isHalf ? starIndex - 0.5 : starIndex;
        
        // Permet de reset à 0 si on ré-appuie exactement sur la note actuelle
        const currentAnime = myAnimes.find(a => a.id === animeId);
        if (currentAnime && currentAnime.rating === finalRating) {
            finalRating = 0;
        }

        changeRating(animeId, finalRating);
    }

    // --- FONCTIONS JSON ---
    function exportJSON() {
        if (myAnimes.length === 0) return alert("Rien à exporter.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myAnimes, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "mon_anime_tracker.json");
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    myAnimes = importedData;
                    saveAndRender();
                } else { alert("Format invalide."); }
            } catch (err) { alert("Erreur de lecture."); }
        };
        reader.readAsText(file);
    }

    renderList();
</script>
</body>
</html>
